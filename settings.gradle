pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = mod_id

// Three modules — common contains platform-agnostic code,
// neoforge and fabric each depend on common and add their own platform code.
include("common", "neoforge")